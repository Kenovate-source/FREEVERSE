# Render Blueprint: the FREEVERSE Node backend (API + static fallback) and a managed PostgreSQL database.
# Secrets are never stored here: every `sync: false` value is typed into the Render dashboard.
services:
  - type: web
    name: freeverse-api
    runtime: node
    plan: starter            # free instances sleep after inactivity and cold-start slowly; use starter or higher for real use
    region: frankfurt        # pick the region closest to your Supabase project and users
    buildCommand: npm ci && npm run build
    startCommand: npm run start:server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - { key: NODE_VERSION, value: 22 }
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: freeverse-db, property: connectionString } }
      - { key: AUTH_PROVIDER, value: supabase }
      - { key: STORAGE_DRIVER, value: supabase }
      - { key: SEED_DEMO_DATA, value: "true" }       # demo content is labelled; set to "false" once real content exists
      - { key: ANONYMOUS_POSTING_ENABLED, value: "false" }
      - { key: TRUST_PROXY_HOPS, value: "1" }
      - { key: PUBLIC_ORIGIN, sync: false }          # https://YOUR-SITE.vercel.app
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_ANON_KEY, sync: false }
      - { key: SUPABASE_SERVICE_ROLE_KEY, sync: false }
      - { key: FOUNDER_EMAIL, sync: false }
      - { key: MEDIA_URL_SECRET, generateValue: true }
      - { key: PROXY_SHARED_SECRET, sync: false }    # same value as the Vercel env var of the same name
      - { key: ANTHROPIC_API_KEY, sync: false }      # optional
databases:
  - name: freeverse-db
    plan: basic-256mb
    region: frankfurt
